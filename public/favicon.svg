<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4a87a" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#c4a87a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c4a87a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- dark parchment-night tile -->
  <rect width="48" height="48" rx="10" fill="#1a1410"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="9.25" fill="none" stroke="#c4a87a" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- candle-glow behind the sigil -->
  <circle cx="24" cy="24" r="17" fill="url(#glow)"/>

  <!-- the four-pointed sigil (echoes the site's ✦ motif) -->
  <path d="M24 9
           C25.3 18.2 29.8 22.7 39 24
           C29.8 25.3 25.3 29.8 24 39
           C22.7 29.8 18.2 25.3 9 24
           C18.2 22.7 22.7 18.2 24 9 Z"
        fill="#c4a87a"/>

  <!-- small companion spark, upper right -->
  <path d="M36 6.5
           C36.35 9.1 37.4 10.15 40 10.5
           C37.4 10.85 36.35 11.9 36 14.5
           C35.65 11.9 34.6 10.85 32 10.5
           C34.6 10.15 35.65 9.1 36 6.5 Z"
        fill="#c4a87a" fill-opacity="0.7"/>
</svg>
